name: Backend CI

on:
  # TUM dallara push CI'yi tetikler. ONCESI `branches: [main]` idi ve `main`
  # korumali oldugu icin (bkz. CONTRIBUTING.md) oraya dogrudan push HIC
  # olmuyordu: ozellik dallari pushlandiginda tek bir is bile kosmuyor, geri
  # bildirim ancak PR acildiktan sonra geliyordu.
  push:
  # PR olayi AYRICA sart: fork'tan gelen PR'larda push olayi bu depoda
  # tetiklenmez, tek kapsam buradan gelir. Ayni depodaki bir dalda PR aciksa
  # her push iki kez kosar (push + synchronize); bu bilincli bir maliyet -
  # `main` uzerindeki zorunlu kontroller PR kosusuna bagli oldugu icin
  # `types:` ile kisip PR kosusunu ayiklamak korumayi zayiflatirdi.
  pull_request:
  # Elle tetikleme: Actions sekmesinden herhangi bir dalda calistirilabilir.
  workflow_dispatch:

# Ayni dala pesi sira push atilirsa eskisi iptal edilir. `github.event_name`
# gruba DAHIL: push ve pull_request kosulari birbirini iptal ETMEMELI - PR
# kosusu iptal olursa zorunlu kontrol "cancelled" kalir ve PR kilitlenir.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # Veri katmani testleri gercek bir PostgreSQL ister (@pytest.mark.db).
    # Servis olmadan bu testler SESSIZCE atlanir ve CI yesil gorunur.
    # pgvector'lu imaj sart: duz postgres imajinda "CREATE EXTENSION vector"
    # basarisiz olur (bkz. docker-compose.yml).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finans
          POSTGRES_PASSWORD: finans
          POSTGRES_DB: finans
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finans"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://finans:finans@localhost:5432/finans

    steps:
      - uses: actions/checkout@v4

      - name: Backend var mi kontrol et
        id: check
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "backend/requirements.txt bulundu."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "backend/requirements.txt yok — adimlar atlaniyor."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.13"

      - name: Bagimliliklari kur
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Semayi ve seed veriyi yukle
        if: steps.check.outputs.exists == 'true'
        env:
          PGPASSWORD: finans
        run: psql -h localhost -U finans -d finans -v ON_ERROR_STOP=1 -q -f db/v5_schema_and_data.sql

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: ruff check .

      - name: Format kontrolu
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: black --check .

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        # `-rs`: atlanan testlerin NEDENI cikti'da gorunsun.
        # Servis bir sekilde devre disi kalirsa db testleri sessizce atlanir ve
        # CI yesil goruntur; asagidaki kontrol tam olarak bunu yakalar.
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest-cikti.txt
          if grep -q "TEST_DATABASE_URL / DATABASE_URL tanimli degil" pytest-cikti.txt; then
            echo "::error::Veri katmani testleri atlandi — Postgres servisi calismiyor."
            exit 1
          fi

  # `borsa-verisi/` backend'in DISINDA, bagimsiz bir betik klasorudur.
  # AYRI JOB SART: yukaridaki job'in her adimi `working-directory: backend`
  # oldugu icin bu klasordeki kod ve 44 test CI'da HIC kosmuyordu - yerelde
  # gecseler de ilk bozulmada kimse haberdar olmazdi.
  #
  # Postgres servisi YOK: bu testler ag ve veritabani gerektirmez, hepsi saf
  # mantik sinar (sembol eslemesi, metrik hesabi, SQL metni uretimi).
  borsa-verisi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: borsa-verisi var mi kontrol et
        id: check
        run: |
          if [ -f borsa-verisi/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "borsa-verisi/requirements.txt bulundu."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "borsa-verisi/requirements.txt yok — adimlar atlaniyor."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.13"

      - name: Bagimliliklari kur
        if: steps.check.outputs.exists == 'true'
        working-directory: borsa-verisi
        run: pip install -r requirements.txt

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: borsa-verisi
        run: ruff check .

      - name: Format kontrolu
        if: steps.check.outputs.exists == 'true'
        working-directory: borsa-verisi
        run: black --check .

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: borsa-verisi
        # pytest hic test toplayamazsa 5 doner ve job kirmizi olur; yol/import
        # bozulmasi sessizce "yesil" gorunmez.
        run: pytest -q -rs
